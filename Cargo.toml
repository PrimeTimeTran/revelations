[package]
name = "revelations"
description = "Revelations helps developers discover hidden patterns in code."
edition = "2024"
version = "0.0.1"
authors = ["Loi Tran"]
license = "MIT OR Apache-2.0"

documentation = "https://docs.rs/revelations"
homepage = "https://kb-blog-primetimetran.vercel.app/"
repository = "https://github.com/primetimetran/revelations"
keywords = ["virtualization","visualization","filesystem", "development-tools", "os"]
categories = ["virtualization","visualization","filesystem", "development-tools", "os"]

[dependencies]

walkdir = "2"
quote = "1.0.45"
prettyplease = "0.2"

clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
regex-syntax = { version = "0.8", features = ["std"] }

swc_core = { version = "70.0.0", features = ["common", "ecma_parser", "ecma_visit", "ecma_ast"] }
regex = "1.12.4"

